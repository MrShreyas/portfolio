[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Omit MAIL_HOST_PORT from secret scanning because '465' is a common number 
  # that causes false positives in binary files (like sharp/libvips).
  SECRETS_SCAN_OMIT_KEYS = "MAIL_HOST_PORT"

[[plugins]]
  package = "@netlify/plugin-nextjs"
